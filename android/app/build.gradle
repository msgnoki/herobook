plugins {
    id "com.android.application"
}

// Charge les credentials de signature depuis un fichier hors du repo.
def keystorePropsFile = file("${System.getProperty('user.home')}/.keystores/herobook-release.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace "com.verrelune.gamebook"
    compileSdk 36

    defaultConfig {
        applicationId "com.verrelune.gamebook"
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // APK plus léger : un seul APK universel sans split (10 enfants, on s'en fout du split ABI)
}

def bookSourceDir = rootProject.file("../livre/xhtml")
def bookAssetsDir = layout.projectDirectory.dir("src/main/assets/book")

tasks.register("syncBookAssets", Copy) {
    from(bookSourceDir)
    into(bookAssetsDir)
}

tasks.named("preBuild") {
    dependsOn("syncBookAssets")
}
